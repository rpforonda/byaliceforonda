name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  # Build (but don't deploy) every PR into main, so a broken build is caught
  # before it's merged rather than when the deploy runs
  pull_request:
    branches: [ main ]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          # always use sharp's prebuilt binary (needed by @sveltejs/enhanced-img)
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
      - run: npm run build
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
