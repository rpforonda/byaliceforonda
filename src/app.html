<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Fonts (Nunito, Poppins) are self-hosted via @fontsource, imported in
		     +layout.svelte. No third-party font requests, so no visitor IPs are
		     sent to Google — keeps the site privacy-friendly and cookieless. -->

		<!-- SvelteKit will inject all <svelte:head> tags from your layouts/pages here -->
		%sveltekit.head%
	</head>

	<body
		data-sveltekit-preload-data="hover"
		class="bg-white text-gray-900 antialiased min-h-screen flex flex-col"
	>
		<!-- SvelteKit will inject the actual rendered app here -->
		<div style="display: contents">
			%sveltekit.body%
		</div>
	</body>
</html>
