<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Preconnect to Google Fonts for faster loading -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Only the families the site uses: Nunito (UI, headings, game) and Poppins (book blurb) -->
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@400&display=swap"
			rel="stylesheet"
		/>

		<!-- SvelteKit will inject all <svelte:head> tags from your layouts/pages here -->
		%sveltekit.head%
	</head>

	<body
		data-sveltekit-preload-data="hover"
		class="bg-white text-gray-900 antialiased min-h-screen flex flex-col"
	>
		<!-- SvelteKit will inject the actual rendered app here -->
		<div style="display: contents">
			%sveltekit.body%
		</div>
	</body>
</html>
